<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Stock Tracker</title>

  <!-- Bootstrap 4 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">

  <style>
    body {
      background: linear-gradient(to right, #d6c3f7, #f2e8ff);
      font-family: 'Segoe UI', sans-serif;
    }

    .navbar {
      background-color: #6a0dad !important;
    }

    .navbar-brand, .nav-link, .navbar-text {
      color: white !important;
    }

    .btn-outline-dark {
      color: #6a0dad;
      border-color: #6a0dad;
    }

    .btn-outline-dark:hover {
      background-color: #6a0dad;
      color: white;
    }

    .glass-container {
      background: rgba(255, 255, 255, 0.65);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 2rem;
      margin-top: 2rem;
    }

    .list-group-item {
      background: rgba(255, 255, 255, 0.85);
      border: none;
    }

    .form-control:focus {
      border-color: #6a0dad;
      box-shadow: 0 0 0 0.2rem rgba(106, 13, 173, 0.25);
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg">
    <a class="navbar-brand d-flex align-items-center" href="/">
      📈 <span class="ml-2">Stock Tracker</span>
    </a>
    <div class="ml-auto">
      {% if user %}
        <span class="navbar-text mr-3">Welcome, {{ user.username }}!</span>
        <a href="/logout" class="btn btn-sm btn-outline-light">Logout</a>
      {% else %}
        <a href="/login" class="btn btn-sm btn-outline-light mr-2">Login</a>
        <a href="/register" class="btn btn-sm btn-outline-light">Register</a>
      {% endif %}
    </div>
  </nav>

  {% block body %}{% endblock %}

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
