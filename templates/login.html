{% extends 'base.html' %}
{% block body %}

<div class="container glass-container">
  <h2 class="mb-4">🔐 Login</h2>
  <form method="POST">
    <div class="form-group">
      <label for="username">Username</label>
      <input name="username" type="text" class="form-control" id="username" placeholder="Enter your username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input name="password" type="password" class="form-control" id="password" placeholder="Enter your password" required>
    </div>
    <button type="submit" class="btn btn-outline-dark">Login</button>
    <a href="/register" class="btn btn-link">Create an account</a>
    <hr>
    <a href="/login/google" class="btn btn-outline-danger btn-block">Login with Google</a>
  </form>
</div>

{% endblock %}
